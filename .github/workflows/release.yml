name: Release

# Publishes to npm via Trusted Publishing (OIDC) when a GitHub Release is
# published. No NPM_TOKEN secret: the id-token permission lets npm verify the
# workflow's OIDC identity against the trusted publisher configured on
# npmjs.com (package -> Settings -> Trusted publishing). Provenance is
# generated automatically.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bun-native repo (bun.lock, no package-lock.json): install and test with Bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Only for the npm CLI used to publish; registry-url writes the .npmrc
      # the OIDC token exchange needs. No token here on purpose.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - run: bun test

      - run: bunx tsc --noEmit -p tsconfig.json

      - name: Check package version matches release tag
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          if [ "${tag#v}" != "$pkg_version" ]; then
            echo "::error::Release tag '$tag' does not match package.json version '$pkg_version'"
            exit 1
          fi

      # Provenance attestation is automatic with a trusted publisher.
      - run: npm publish
